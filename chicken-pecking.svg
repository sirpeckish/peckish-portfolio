<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A chicken pecking a bug off the ground">
  <!-- ground + shadow -->
  <ellipse cx="128" cy="161" rx="52" ry="4" fill="#1d1710" opacity=".15"/>
  <path d="M10 160 H230" stroke="#1d1710" stroke-width="2.5" stroke-linecap="round"/>

  <!-- legs (behind body) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 132 L120 159 M120 159 L110 161 M120 159 L121 163 M120 159 L129 162" stroke="#1d1710" stroke-width="7"/>
    <path d="M142 128 L144 159 M144 159 L135 161 M144 159 L145 163 M144 159 L153 161" stroke="#1d1710" stroke-width="7"/>
    <path d="M124 132 L120 159 M120 159 L110 161 M120 159 L121 163 M120 159 L129 162" stroke="#dfa41f" stroke-width="3.5"/>
    <path d="M142 128 L144 159 M144 159 L135 161 M144 159 L145 163 M144 159 L153 161" stroke="#dfa41f" stroke-width="3.5"/>
  </g>

  <!-- comb (behind head outline) -->
  <path transform="translate(0 -6)" d="M50 124 C40 121 39 111 47 110 C43 102 53 97 58 103 C58 95 68 93 70 101 C75 97 82 102 77 110 L66 117 Z" fill="#c8271b" stroke="#1d1710" stroke-width="3" stroke-linejoin="round"/>

  <!-- one silhouette: head, neck, back, tail, belly, breast -->
  <path d="M52 112
           C56 108 66 107 72 110
           C82 105 92 96 104 84
           C118 72 140 66 158 62
           C166 56 172 44 176 30
           C186 42 192 58 193 72
           C194 86 188 94 180 99
           C178 114 168 126 152 131
           C138 137 118 138 104 133
           C96 131 90 130 84 131
           C78 134 72 136 66 136
           C60 136 55 133 53 129
           C49 124 48 117 52 112 Z"
        fill="#f3ecdb" stroke="#1d1710" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- tail feathers -->
  <g stroke="#1d1710" stroke-width="2.4" stroke-linecap="round">
    <path d="M160 66 C168 56 173 44 176 32"/>
    <path d="M166 74 C176 64 184 52 188 44"/>
    <path d="M172 86 C180 80 187 74 192 70"/>
  </g>

  <!-- hackles where the neck meets the body -->
  <path d="M100 90 C96 98 94 104 96 112 C92 116 90 122 92 128" stroke="#1d1710" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- folded wing -->
  <path d="M106 96 C124 84 152 86 168 102
           C160 108 150 110 142 111
           C150 114 156 117 160 121
           C142 126 120 122 108 112
           C102 106 101 100 106 96 Z"
        fill="#dfa41f" stroke="#1d1710" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#1d1710" stroke-width="2" stroke-linecap="round">
    <path d="M114 100 C128 94 144 96 156 104"/>
    <path d="M114 108 C126 106 136 108 144 112"/>
  </g>

  <!-- beak, open to snap up the bug -->
  <path transform="translate(0 -6)" d="M50 125 C47 133 45 141 43 149 L59 135 Z" fill="#dfa41f" stroke="#1d1710" stroke-width="2.6" stroke-linejoin="round"/>
  <path transform="translate(0 -6)" d="M59 135 L54 153 C58 149 62 145 66 140 Z" fill="#dfa41f" stroke="#1d1710" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- wattle -->
  <path transform="translate(3 -7)" d="M60 139 C57 147 61 153 66 151 C69 147 67 142 65 139 Z" fill="#c8271b" stroke="#1d1710" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- eye -->
  <circle cx="61" cy="120" r="3.6" fill="#fff" stroke="#1d1710" stroke-width="2"/>
  <circle cx="60" cy="121" r="1.7" fill="#1d1710"/>

  <!-- the bug -->
  <g transform="translate(36 152)">
    <g stroke="#1d1710" stroke-width="1.8" stroke-linecap="round">
      <path d="M-5 2 L-8 8 L-10 8"/><path d="M0 3 L0 8 L-2 8"/><path d="M5 2 L8 8 L10 8"/>
      <path d="M-10 -2 C-14 -6 -16 -8 -18 -7"/><path d="M-9 -4 C-11 -9 -13 -11 -15 -11"/>
    </g>
    <path d="M-7 3 C-7 -4 -3 -6 1 -6 C6 -6 9 -3 9 3 Z" fill="#1d1710"/>
    <path d="M1 -6 V3" stroke="#f3ecdb" stroke-width="1.3"/>
    <circle cx="-9" cy="0" r="3" fill="#1d1710"/>
  </g>

  <!-- peck impact -->
  <g stroke="#c8271b" stroke-width="2.2" stroke-linecap="round">
    <path d="M20 136 L14 131"/><path d="M27 132 L25 125"/><path d="M14 143 L7 141"/>
  </g>
</svg>
